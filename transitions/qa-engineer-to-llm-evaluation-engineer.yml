evaluation_playbook:
    metrics:
        quality:
            - "Faithfulness (supported claim ratio)"
            - "Hallucination Rate (unsupported claim incidence)"
            - "Relevance / Semantic Similarity"
            - "Coverage (missing key fact count)"
        retrieval:
            - "Context Recall@k"
            - "Context Precision@k"
            - "Grounded Answer Ratio"
        safety:
            - "Toxicity Score Distribution"
            - "Jailbreak Success Rate"
            - "Prompt Injection Success Rate"
            - "PII Leakage Rate"
        cost_latency:
            - "Tokens per Successful Task"
            - "Cost per Correct Answer"
            - "p95 Latency"
        robustness:
            - "Adversarial Variant Accuracy"
            - "Drift (metric delta vs baseline)"
    workflow_steps:
        - "Define target use-case & success metrics with stakeholders."
        - "Curate & version datasets (gold, synthetic, adversarial)."
        - "Run baseline evaluation across model/prompt variants."
        - "Cluster failures, classify failure modes, prioritize."
        - "Iterate prompts/retrieval/safety rules; re-measure."
        - "Nightly regression + alerts on threshold breaches."
        - "Monthly drift & cost review; update datasets as domain evolves."
    reporting:
        - "Dashboard (trend lines + thresholds)"
        - "Failure Cluster Digest"
        - "Safety Incident Log"
        - "Changelog (dataset/model/prompt versions)"

portfolio_project_ideas:
    - title: "Hallucination Reduction Study"
      description: "Baseline vs improved retrieval/prompt chain; measure hallucination rate drop & faithfulness gain."
    - title: "Adversarial Red-Team Harness"
      description: "Automated jailbreak/injection suite with mitigation iteration and success-rate tracking."
    - title: "Cost & Latency Optimization Dashboard"
      description: "Token/latency instrumentation plus caching & model tiering experiments; report $/correct answer."
    - title: "Retrieval Strategy Benchmark"
      description: "Chunking overlap & hybrid search vs pure vector; analyze recall@k, precision@k, latency."
    - title: "Safety & Bias Evaluation Suite"
      description: "Integrate toxicity/PII/bias probes; scheduled regression and summary reports."
    - title: "Golden Dataset Versioning System"
      description: "Automated dataset diff & semantic coverage reporting integrated into CI."

ethical_and_safety_considerations:
    - "Bias & Fairness: include protected attribute variants; monitor disparate error rates."
    - "Privacy: detect & mask PII; minimize storage of raw user inputs."
    - "Prompt Injection Defense: sanitize external content, restrict tool/function access."
    - "Jailbreak Mitigation: maintain evolving adversarial suite; track success trends."
    - "Transparency: document metrics, thresholds, known limitations."
    - "Responsible Deployment: gate releases on meeting safety + quality criteria."

risk_mitigation_for_role_future:
    - "Deepen metric sophistication (beyond generic similarity)."
    - "Own automated pipelines & infrastructure, not just manual analysis."
    - "Integrate retrieval + safety + cost dimensions for multi-axis expertise."
    - "Maintain reproducibility (versioned datasets, config-locked runs)."
    - "Quantify business impact (cost reduction, reliability improvements)."
    - "Continuously track model/provider changes & emerging evaluation research."
